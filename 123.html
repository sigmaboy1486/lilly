<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Lilium" />
<meta name="format-detection" content="telephone=no" />
<meta name="theme-color" content="#1a0e1c" />
<meta name="description" content="A small pink lily, waiting inside a letter." />
<title>Pink Lily Letter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23241322'/%3E%3Cpath d='M32 48c-1-11-7-18-16-23 10-3 16 3 16 13 0-10 6-16 16-13-9 5-15 12-16 23Z' fill='%23ed86ae'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#fbeef3; --muted:#cdb2c1; --pink:#ee86ae; --pink-light:#f9c3d6;
  --gold:#e9c179; --gold-soft:#f5dca4; --plum:#1a0e1c;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Jost',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--plum);color:var(--ink);font-family:var(--sans);overflow:hidden}
button{font:inherit;color:inherit}
html,body{overscroll-behavior:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;width:100%}
.install{display:none;border:1px solid rgba(233,193,121,.45);background:rgba(26,14,28,.5);color:var(--gold-soft);border-radius:2rem;padding:.45rem .95rem;font-size:.8rem;letter-spacing:.03em;cursor:pointer}
.install.show{display:inline-block}
.letter,.replay,.install{min-height:44px}

.scene{position:relative;height:100svh;height:100dvh;overflow:hidden;isolation:isolate;
  background:
    radial-gradient(ellipse 60% 50% at 50% 46%,rgba(176,66,120,.28),transparent 70%),
    radial-gradient(ellipse 40% 35% at 85% 8%,rgba(233,193,121,.10),transparent 70%),
    radial-gradient(ellipse 50% 40% at 8% 95%,rgba(238,134,174,.10),transparent 70%),
    linear-gradient(160deg,#2c1427 0%,#1a0e1c 55%,#0f0911 100%);
  transition:background 1.6s var(--ease)}
.scene::before{content:'';position:absolute;inset:0;z-index:-1;opacity:.5;
  background:
    radial-gradient(circle at 18% 30%,rgba(249,195,214,.10) 0 .5rem,transparent .55rem),
    radial-gradient(circle at 78% 22%,rgba(233,193,121,.12) 0 .8rem,transparent .85rem),
    radial-gradient(circle at 70% 78%,rgba(249,195,214,.08) 0 1.2rem,transparent 1.25rem),
    radial-gradient(circle at 30% 82%,rgba(233,193,121,.08) 0 .6rem,transparent .65rem),
    radial-gradient(circle at 90% 55%,rgba(249,195,214,.07) 0 .9rem,transparent .95rem)}
.grain{position:absolute;inset:0;z-index:30;pointer-events:none;opacity:.10;mix-blend-mode:soft-light;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E")}

.masthead,.footer{position:absolute;left:clamp(1.4rem,4vw,4rem);right:clamp(1.4rem,4vw,4rem);z-index:5;display:flex;justify-content:space-between;align-items:center}
.masthead{top:max(1.6rem,env(safe-area-inset-top))}
.footer{bottom:max(1.5rem,env(safe-area-inset-bottom));color:rgba(205,178,193,.55);font-size:.78rem;letter-spacing:.04em;justify-content:center}
.wordmark{font-family:var(--serif);font-style:italic;font-size:1.45rem;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:.6rem}
.wordmark i{color:var(--gold);font-style:normal;font-size:.9rem}

.stage{position:absolute;inset:0}

/* intro */
.intro{position:absolute;left:clamp(1.5rem,9vw,9rem);top:50%;width:min(26rem,38vw);transform:translateY(-55%);z-index:3;
  transition:opacity 1s ease,transform 1.2s var(--ease)}
.intro h1{margin:0 0 1.1rem;font-family:var(--serif);font-weight:400;font-size:clamp(3.2rem,6vw,6rem);line-height:.92;letter-spacing:-.025em}
.intro h1 em{color:var(--pink-light)}
.intro p{margin:0;max-width:15rem;color:var(--muted);font-family:var(--serif);font-size:1.2rem;line-height:1.4}
[data-state=opening] .intro,[data-state=bloomed] .intro{opacity:0;transform:translate(-1.5rem,-55%);pointer-events:none}

/* letter */
.letter{position:absolute;left:calc(50% + 14vw);top:50%;width:clamp(17rem,28vw,26rem);aspect-ratio:1.4/1;border:0;padding:0;background:none;cursor:pointer;z-index:4;
  margin:calc(clamp(17rem,28vw,26rem)/-2.8) 0 0 calc(clamp(17rem,28vw,26rem)/-2);
  transform:rotate(-4deg);transition:transform 1s var(--ease),opacity .9s ease .1s;perspective:900px}
.letter:hover{transform:rotate(-2deg) translateY(-.4rem)}
.letter:focus-visible{outline:1px solid var(--gold);outline-offset:.9rem;border-radius:.4rem}
.letter>span{position:absolute;display:block}
.shadow{inset:14% -4% -14%;background:rgba(0,0,0,.45);filter:blur(1.6rem);border-radius:50%}
.env-back{inset:0;border-radius:.3rem;background:linear-gradient(150deg,#8d3d66,#6a2a4e);box-shadow:inset 0 0 0 1px rgba(255,218,228,.12)}
.paper{left:9%;right:9%;top:6%;height:82%;z-index:1;padding:1.3rem 1.5rem;border-radius:.15rem;color:#6d354a;
  background:linear-gradient(120deg,#ffeee3,#f8d9d2);box-shadow:0 .2rem .9rem rgba(40,7,24,.18);
  display:flex;flex-direction:column;transition:transform 1s var(--ease)}
.paper .date{align-self:flex-end;font-size:.62rem;letter-spacing:.14em;color:#b0747e}
.paper .hi{margin-top:1.1rem;font-family:var(--serif);font-style:italic;font-size:clamp(1.3rem,2.2vw,1.8rem)}
.paper u{display:block;height:1px;margin-top:.6rem;background:rgba(142,73,91,.3);text-decoration:none}
.paper u:nth-of-type(1){width:86%;margin-top:1.1rem}.paper u:nth-of-type(2){width:70%}.paper u:nth-of-type(3){width:52%}
.paper .by{margin-top:auto;align-self:flex-end;font-family:var(--serif);font-style:italic;font-size:.95rem;color:#b0747e}
.env-front{inset:0;z-index:2;border-radius:.3rem;background:linear-gradient(165deg,#a14b71,#7a3255);
  clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);filter:drop-shadow(0 -1px 0 rgba(255,221,230,.25))}
.flap{left:0;right:0;top:0;height:56%;z-index:3;background:linear-gradient(180deg,#b05b80,#8a3d62);clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:50% 0;transition:transform .8s var(--ease),z-index 0s .35s}
.seal{left:50%;top:54%;z-index:4;width:2.8rem;height:2.8rem;margin:-1.4rem 0 0 -1.4rem;display:grid;place-items:center;border-radius:50%;
  color:var(--gold-soft);font-size:.9rem;background:radial-gradient(circle at 35% 28%,#d27a95,#8a3159 72%);
  border:1px solid rgba(255,231,185,.45);box-shadow:0 .3rem .8rem rgba(37,7,23,.3);transition:opacity .4s ease,transform .6s var(--ease)}
.hint{right:2%;bottom:-2.4rem;color:var(--gold);font-family:var(--serif);font-style:italic;font-size:1.05rem;transition:opacity .4s ease}
[data-state=opening] .flap,[data-state=bloomed] .flap{transform:rotateX(180deg);z-index:0}
[data-state=opening] .seal,[data-state=bloomed] .seal,[data-state=opening] .hint,[data-state=bloomed] .hint{opacity:0;transform:scale(.6)}
[data-state=opening] .paper,[data-state=bloomed] .paper{transform:translateY(-62%)}
[data-state=bloomed] .letter{opacity:0;transform:translateY(7vh) scale(.78) rotate(-2deg);pointer-events:none}

/* lily */
#lily{position:absolute;left:50%;top:50%;width:min(98vw,calc(94svh*.78));aspect-ratio:640/820;height:auto;transform:translate(-50%,-50%);
  opacity:0;pointer-events:none;overflow:visible;transition:opacity 1s ease}
[data-state=bloomed] #lily{opacity:1;transition-delay:.1s}
.sway{transform-origin:306px 800px;animation:sway 8s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-.9deg)}to{transform:rotate(1.1deg)}}
.tp{transform-origin:0 0;transform:rotate(var(--a))}
.tpi{transform-origin:0 0;transform:scale(.08,.14);opacity:0;transition:transform .9s ease,opacity .5s ease}
[data-state=bloomed] .tpi{transform:scale(1);opacity:1;transition:transform 2.1s cubic-bezier(.2,1.2,.4,1) var(--d),opacity 1s ease var(--d)}
.ste{transform-origin:0 0;transform:scale(.15);opacity:0;transition:all .5s ease}
[data-state=bloomed] .ste{transform:scale(1);opacity:1;transition:transform 1.5s var(--ease) 1.5s,opacity 1s ease 1.5s}
.stem{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .6s ease}
[data-state=bloomed] .stem{stroke-dashoffset:0;transition:stroke-dashoffset 1.6s var(--ease) .1s}
.lf{transform-origin:0 0;transform:scale(0);transition:transform .5s ease}
[data-state=bloomed] .lf{transform:scale(1);transition:transform 1.4s var(--ease) var(--d)}
.glow{opacity:0;transition:opacity 1.5s ease}
[data-state=bloomed] .glow{opacity:1;transition-delay:.6s}
.dust{opacity:0;animation:drift 7s ease-in-out infinite}
[data-state=bloomed] .dust{opacity:.85}
@keyframes drift{50%{transform:translate(var(--x),var(--y))}}

.reveal{position:absolute;left:0;right:0;bottom:0;padding:3.5rem 1rem calc(max(1.5rem,env(safe-area-inset-bottom)) + 1.6rem);background:linear-gradient(to top,rgba(26,14,28,.92) 40%,rgba(26,14,28,0));z-index:6;text-align:center;opacity:0;pointer-events:none;transition:opacity .6s ease}
[data-state=bloomed] .reveal{opacity:1;pointer-events:auto;transition:opacity 1s ease 2.4s}
.reveal p{margin:0 0 .4rem;font-family:var(--serif);font-style:italic;font-size:1.45rem;color:var(--pink-light);text-shadow:0 1px 12px rgba(20,8,22,.8)}
.replay{border:0;background:none;padding:.4rem .6rem;cursor:pointer;color:var(--muted);font-size:.85rem;letter-spacing:.04em}
.replay:hover{color:var(--gold-soft)}
.replay:focus-visible{outline:1px solid var(--gold);border-radius:.3rem}

@media (max-width:900px){
  .intro{left:0;right:0;top:15%;width:auto;transform:none;text-align:center;padding:0 1.5rem}
  .intro h1{font-size:clamp(2.9rem,12vw,4.2rem)}
  .intro p{margin:0 auto;max-width:18rem}
  [data-state=opening] .intro,[data-state=bloomed] .intro{transform:translateY(-1rem)}
  .letter{left:50%;top:58%;width:min(21rem,80vw);margin:calc(min(21rem,80vw)/-2.8) 0 0 calc(min(21rem,80vw)/-2)}
  #lily{width:min(112vw,calc(88svh*.78))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important;transition-delay:0s!important}
}
</style>
</head>
<body>
<main class="scene" data-state="letter" id="scene">
  <div class="grain" aria-hidden="true"></div>
  <header class="masthead"><a class="wordmark" href="#" aria-label="Pink Lily Letter home"><i>✦</i>Lilium</a><button class="install" id="install" type="button">Add to home screen</button></header>

  <section class="stage" aria-label="Interactive letter and flower reveal">
    <div class="intro">
      <h1>For the <em>autistic.</em></h1>
      <p>Some things are meant to open slowly.</p>
    </div>

    <button class="letter" id="letter" type="button" aria-pressed="false" aria-label="Open the letter and reveal the lily">
      <span class="shadow" aria-hidden="true"></span>
      <span class="env-back" aria-hidden="true"></span>
      <span class="paper" aria-hidden="true"><i class="date">19 · 10 · 26</i><b class="hi">dear you,</b><u></u><u></u><u></u><em class="by">with tenderness</em></span>
      <span class="env-front" aria-hidden="true"></span>
      <span class="flap" aria-hidden="true"></span>
      <span class="seal" aria-hidden="true">✦</span>
      <span class="hint" aria-hidden="true">tap to open</span>
    </button>

    <svg id="lily" viewBox="0 0 640 820" role="img" aria-label="A pink lily in full bloom" aria-hidden="true"></svg>

    <div class="reveal" aria-live="polite">
      <p>a little lily</p>
      <button class="replay" id="replay" type="button">fold it back ↺</button>
    </div>
  </section>
  <footer class="footer">Pink, with a little gold.</footer>
</main>

<script>
(function(){
  /* ---------- Draw the lily ---------- */
  var seed=11, rnd=function(){seed=seed*16807%2147483647;return seed/2147483647;};
  var f=function(n){return n.toFixed(1);};

  function tepalPath(L,W){
    var w=W/2;
    return 'M0 0C'+f(-w*.5)+' '+f(-L*.12)+' '+f(-w*1.3)+' '+f(-L*.42)+' '+f(-w*1.05)+' '+f(-L*.66)+
      'C'+f(-w*.88)+' '+f(-L*.86)+' '+f(-w*.26)+' '+f(-L*.95)+' 0 '+f(-L)+
      'C'+f(w*.26)+' '+f(-L*.95)+' '+f(w*.88)+' '+f(-L*.86)+' '+f(w*1.05)+' '+f(-L*.66)+
      'C'+f(w*1.3)+' '+f(-L*.42)+' '+f(w*.5)+' '+f(-L*.12)+' 0 0Z';
  }

  function tepal(a,L,W,inner,delay){
    var d=tepalPath(L,W), s='<g class="tp" style="--a:'+a+'deg"><g class="tpi" style="--d:'+delay+'ms">';
    s+='<path d="'+d+'" fill="url(#'+(inner?'gIn':'gOut')+')"/>';
    for(var i=-4;i<=4;i++){ if(!i) continue;
      var x=i*W*.095;
      s+='<path d="M0 '+f(-L*.04)+'Q'+f(x*1.1)+' '+f(-L*.4)+' '+f(x*1.35)+' '+f(-L*.82)+'" stroke="rgba(150,30,90,.16)" stroke-width=".9" fill="none"/>';
    }
    s+='<path d="M0 0L'+f(-W*.04)+' '+f(-L*.1)+'L'+f(-W*.022)+' '+f(-L*.88)+'L0 '+f(-L*.97)+'L'+f(W*.022)+' '+f(-L*.88)+'L'+f(W*.04)+' '+f(-L*.1)+'Z" fill="url(#gRib)"/>';
    var n=inner?64:48;
    for(var k=0;k<n;k++){
      var t=.1+Math.pow(rnd(),.9)*.55, y=-L*t;
      var half=W*.5*Math.sin(Math.min(1,t*1.5+.1)*Math.PI*.5)*.78;
      var x2=(rnd()*2-1)*half, r=.8+rnd()*1.9;
      s+='<ellipse cx="'+f(x2)+'" cy="'+f(y)+'" rx="'+f(r*.95)+'" ry="'+f(r*1.25)+'" fill="#9c1458" opacity="'+(.4+rnd()*.45).toFixed(2)+'"/>';
      if(r>1.6) s+='<circle cx="'+f(x2-.5)+'" cy="'+f(y-.6)+'" r=".6" fill="#ffd0e2" opacity=".6"/>';
    }
    s+='<path d="'+d+'" fill="url(#gEdge)"/><path d="'+d+'" fill="url(#gShade)"/>';
    s+='<path d="'+d+'" fill="none" stroke="rgba(255,238,244,.4)" stroke-width="1"/>';
    s+='<path d="M'+f(-W*.18)+' '+f(-L*.93)+'Q0 '+f(-L*1.02)+' '+f(W*.18)+' '+f(-L*.93)+'" stroke="rgba(255,255,255,.35)" stroke-width="2" fill="none" stroke-linecap="round"/>';
    return s+'</g></g>';
  }

  function stamen(th,R,delay){
    var r=th*Math.PI/180, ex=R*Math.sin(r), ey=-R*Math.cos(r);
    var cx=ex*.5+Math.cos(r)*10, cy=ey*.5+Math.sin(r)*10;
    var s='<path d="M0 0Q'+f(cx)+' '+f(cy)+' '+f(ex)+' '+f(ey)+'" stroke="url(#gFil)" stroke-width="3.4" fill="none" stroke-linecap="round"/>';
    s+='<g transform="translate('+f(ex)+' '+f(ey)+') rotate('+f(th+80+rnd()*20)+')">';
    s+='<ellipse rx="5.6" ry="21" fill="url(#gAnth)"/><ellipse rx="1.8" ry="15" cx="-1.4" fill="#d9783a" opacity=".6"/>';
    for(var i=0;i<7;i++) s+='<circle cx="'+f((rnd()-.5)*12)+'" cy="'+f((rnd()-.5)*40)+'" r="'+f(.7+rnd()*.9)+'" fill="#e08a33" opacity=".85"/>';
    return s+'</g>';
  }

  var defs='<defs>'+
   '<linearGradient id="gIn" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#d9e49b"/><stop offset=".1" stop-color="#f4e3d0"/><stop offset=".26" stop-color="#f3a6c4"/><stop offset=".5" stop-color="#ec78a7"/><stop offset=".82" stop-color="#f295b9"/><stop offset="1" stop-color="#f8c4d6"/></linearGradient>'+
   '<linearGradient id="gOut" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#cfe08c"/><stop offset=".1" stop-color="#efd9c6"/><stop offset=".28" stop-color="#ee94b8"/><stop offset=".55" stop-color="#e2639a"/><stop offset=".85" stop-color="#ec86ae"/><stop offset="1" stop-color="#f5b6cc"/></linearGradient>'+
   '<radialGradient id="gEdge" cx=".5" cy=".55" r=".62"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".58" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff2f6" stop-opacity=".7"/></radialGradient>'+
   '<linearGradient id="gShade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".46" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#6e0a3c" stop-opacity=".28"/><stop offset=".54" stop-color="#6e0a3c" stop-opacity=".02"/><stop offset="1" stop-color="#4a0627" stop-opacity=".26"/></linearGradient>'+
   '<linearGradient id="gRib" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#d4e68a" stop-opacity=".9"/><stop offset=".25" stop-color="#e6a3b0" stop-opacity=".5"/><stop offset=".6" stop-color="#c73d84" stop-opacity=".35"/><stop offset="1" stop-color="#c73d84" stop-opacity="0"/></linearGradient>'+
   '<radialGradient id="gThroat"><stop offset="0" stop-color="#b6d95a"/><stop offset=".45" stop-color="#d8e585" stop-opacity=".85"/><stop offset="1" stop-color="#f3e4a0" stop-opacity="0"/></radialGradient>'+
   '<linearGradient id="gFil" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f1f1c4"/><stop offset="1" stop-color="#cfe08a"/></linearGradient>'+
   '<linearGradient id="gAnth" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5a1d0a"/><stop offset=".5" stop-color="#a8451b"/><stop offset="1" stop-color="#6a2610"/></linearGradient>'+
   '<linearGradient id="gStem" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b5528"/><stop offset=".45" stop-color="#7d9a4a"/><stop offset="1" stop-color="#34491f"/></linearGradient>'+
   '<linearGradient id="gLeaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#78994a"/><stop offset=".5" stop-color="#46662d"/><stop offset="1" stop-color="#2f4a22"/></linearGradient>'+
   '<radialGradient id="gGlow"><stop offset="0" stop-color="#ee6fa3" stop-opacity=".5"/><stop offset="1" stop-color="#ee6fa3" stop-opacity="0"/></radialGradient>'+
   '<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#2a0518" flood-opacity=".5"/></filter>'+
   '</defs>';

  function leaf(x,y,rot,len,d){
    var k=len/230;
    return '<g transform="translate('+x+' '+y+') rotate('+rot+') scale('+k+')"><g class="lf" style="--d:'+d+'ms">'+
      '<path d="M0 0C40-18 140-24 230-4C140 9 40 13 0 0Z" fill="url(#gLeaf)" filter="url(#soft)"/>'+
      '<path d="M0 0C80-3 160-7 226-4" stroke="rgba(214,235,150,.55)" stroke-width="1.6" fill="none"/>'+
      '<path d="M30 -4C90-12 160-16 200-9M30 3C90 4 160 0 200-3" stroke="rgba(214,235,150,.18)" stroke-width="1" fill="none"/></g></g>';
  }

  var svg='<g class="sway">'+
    '<circle class="glow" cx="320" cy="300" r="300" fill="url(#gGlow)"/>'+
    '<path class="stem" pathLength="1" d="M306 800C300 600 324 470 320 320" stroke="url(#gStem)" stroke-width="10" fill="none" stroke-linecap="round" filter="url(#soft)"/>'+
    leaf(304,640,-160,250,900)+leaf(309,720,-22,260,1050)+leaf(313,540,-24,190,1200)+leaf(316,470,-158,150,1350)+
    '<g transform="translate(320 300) scale(1 .86)" filter="url(#soft)">';
  var outer=[0,120,240], inner=[60,180,300], i;
  for(i=0;i<3;i++) svg+=tepal(outer[i]+(rnd()*6-3),208,122,false,150+i*110);
  for(i=0;i<3;i++) svg+=tepal(inner[i]+(rnd()*6-3),198,156,true,420+i*110);
  svg+='<circle r="58" fill="url(#gThroat)"/>';
  svg+='<g class="ste">';
  var st=[24,84,144,204,264,324];
  for(i=0;i<6;i++) svg+=stamen(st[i]+rnd()*8,96+rnd()*22,0);
  svg+='<path d="M0 0Q26-44 44-124" stroke="#dfe7a4" stroke-width="4.4" fill="none" stroke-linecap="round"/>';
  svg+='<g transform="translate(44 -124)">';
  for(i=0;i<3;i++) svg+='<ellipse rx="5" ry="9" cy="-6" transform="rotate('+(i*120)+')" fill="#d6dd8e" stroke="#a3b55c" stroke-width="1"/>';
  svg+='<circle r="4.2" fill="#c8d174"/></g></g></g></g>';
  for(i=0;i<16;i++){
    var px=130+rnd()*380, py=80+rnd()*480, pr=1+rnd()*1.8;
    svg+='<circle class="dust" cx="'+f(px)+'" cy="'+f(py)+'" r="'+f(pr)+'" fill="#f5dca4" style="--x:'+f((rnd()-.5)*40)+'px;--y:'+f(-10-rnd()*40)+'px;animation-delay:'+f(rnd()*-7)+'s;animation-duration:'+f(6+rnd()*5)+'s"/>';
  }
  document.getElementById('lily').innerHTML=defs+svg;

  /* ---------- Interaction ---------- */
  var scene=document.getElementById('scene'),
      letter=document.getElementById('letter'),
      replay=document.getElementById('replay'),
      lily=document.getElementById('lily'), timer;

  function set(state){
    clearTimeout(timer);
    scene.dataset.state=state;
    var bloomed=state==='bloomed';
    letter.setAttribute('aria-pressed',String(bloomed||state==='opening'));
    letter.setAttribute('aria-label',bloomed?'The lily is open':'Open the letter and reveal the lily');
    lily.setAttribute('aria-hidden',String(!bloomed));
  }
  letter.addEventListener('click',function(){
    if(scene.dataset.state!=='letter') return;
    set('opening');
    timer=setTimeout(function(){set('bloomed');setTimeout(function(){replay.focus({preventScroll:true});},2600);},1000);
  });
  replay.addEventListener('click',function(){set('letter');setTimeout(function(){letter.focus({preventScroll:true});},500);});

  /* ---------- App shell: icons, manifest, install, haptics, swipe ---------- */
  function icon(size){
    var c=document.createElement('canvas');c.width=c.height=size;
    var x=c.getContext('2d'),k=size/512,i;
    x.fillStyle='#241322';x.fillRect(0,0,size,size);
    var g=x.createRadialGradient(256*k,256*k,0,256*k,256*k,300*k);
    g.addColorStop(0,'rgba(190,70,125,.55)');g.addColorStop(1,'rgba(190,70,125,0)');
    x.fillStyle=g;x.fillRect(0,0,size,size);
    x.translate(256*k,256*k);
    for(i=0;i<6;i++){
      x.save();x.rotate(i*Math.PI/3);
      var pg=x.createLinearGradient(0,0,0,-158*k);
      pg.addColorStop(0,'#e8e6a0');pg.addColorStop(.28,'#ee7fae');pg.addColorStop(1,'#f9c3d6');
      x.fillStyle=pg;x.beginPath();x.moveTo(0,0);
      x.bezierCurveTo(-50*k,-30*k,-54*k,-112*k,0,-158*k);
      x.bezierCurveTo(54*k,-112*k,50*k,-30*k,0,0);x.fill();
      x.strokeStyle='rgba(150,30,90,.35)';x.lineWidth=2*k;x.beginPath();x.moveTo(0,-8*k);x.lineTo(0,-120*k);x.stroke();
      x.restore();
    }
    for(i=0;i<6;i++){
      var a=(i*60+20)*Math.PI/180,ex=Math.sin(a)*64*k,ey=-Math.cos(a)*64*k;
      x.strokeStyle='#e9c179';x.lineWidth=3*k;x.beginPath();x.moveTo(0,0);x.lineTo(ex,ey);x.stroke();
      x.fillStyle='#a8451b';x.beginPath();x.ellipse(ex,ey,6*k,12*k,a,0,7);x.fill();
    }
    return c.toDataURL('image/png');
  }
  try{
    var i180=icon(180),i192=icon(192),i512=icon(512);
    var at=document.createElement('link');at.rel='apple-touch-icon';at.href=i180;document.head.appendChild(at);
    var fv=document.querySelector('link[rel=icon]');if(fv)fv.href=i192;
    var man={name:'Pink Lily Letter',short_name:'Lilium',description:'A small pink lily, waiting inside a letter.',
      start_url:location.href.split('#')[0],scope:location.href.split('#')[0].replace(/[^\/]*$/,''),display:'standalone',orientation:'portrait',
      background_color:'#1a0e1c',theme_color:'#1a0e1c',
      icons:[{src:i192,sizes:'192x192',type:'image/png',purpose:'any maskable'},{src:i512,sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
    var ml=document.createElement('link');ml.rel='manifest';
    ml.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));
    document.head.appendChild(ml);
  }catch(e){}
  if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
  var deferred,inst=document.getElementById('install');
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;inst.classList.add('show');});
  inst.addEventListener('click',function(){if(!deferred)return;deferred.prompt();deferred.userChoice.then(function(){deferred=null;inst.classList.remove('show');});});
  window.addEventListener('appinstalled',function(){inst.classList.remove('show');});

  var buzz=function(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}};
  letter.addEventListener('click',function(){
    if(scene.dataset.state!=='opening')return;
    buzz(12);setTimeout(function(){buzz([18,40,18,40,30]);},1100);
  });
  var y0=null;
  letter.addEventListener('pointerdown',function(e){y0=e.clientY;});
  letter.addEventListener('pointermove',function(e){if(y0!==null&&y0-e.clientY>36){y0=null;letter.click();}});
  ['pointerup','pointercancel','pointerleave'].forEach(function(n){letter.addEventListener(n,function(){y0=null;});});
  document.addEventListener('gesturestart',function(e){e.preventDefault();});
})();
</script>
</body>
